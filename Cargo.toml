[package]
name = "osubackup"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Backup osu!lazer to Google Drive from the system tray"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
image = { version = "0.25", default-features = false, features = ["png"] }
md-5 = "0.11.0"
notify-rust = "4.19.0"
oauth2 = { version = "5", default-features = false, features = ["reqwest", "reqwest-blocking", "rustls-tls"] }
open = "5.4.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.1"
tao = "0.37.2"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = "0.26.1"
walkdir = "2.5.0"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
